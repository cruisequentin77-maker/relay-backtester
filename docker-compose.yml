version: "3.9"
services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  frontend:
    image: python:3.11-slim
    working_dir: /usr/share/webapp
    volumes:
      - ./frontend:/usr/share/webapp
    command: python3 -m http.server 5173
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # Single-origin production image. Not started by plain `docker compose up`.
  # docker compose --profile prod up --build web
  web:
    profiles: ["prod"]
    build: .
    environment:
      PORT: "8000"
      RELAY_ALLOW_REMOTE: "0"
    ports:
      - "8000:8000"
